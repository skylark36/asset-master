<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Premium Multi-Platform Asset Valuation & Management Dashboard">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Asset Master">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Asset Master</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent the browser rubber-banding/bounce effect and swipe-navigation */
    html, body {
      overscroll-behavior: none;
      margin: 0;
      padding: 0;
      background-color: #090D1A; /* Matching AppTheme.background HSL Space Blue */
    }
  </style>
</head>
<body>
  <script>
    // Prevent native iOS Safari edge-swipe back navigation in standalone PWA mode
    // to prevent the PWA from displaying a blank screen or crashing the Flutter runtime.
    if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
      let touchStartX = 0;
      
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
        }
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (touchStartX > 0 && touchStartX < 25) { // 25px edge threshold
          const touchCurrentX = e.touches[0].clientX;
          const deltaX = touchCurrentX - touchStartX;
          
          if (deltaX > 10) { // dragging right
            e.preventDefault();
          }
        }
      }, { passive: false });

      document.addEventListener('touchend', () => {
        touchStartX = 0;
      }, { passive: true });
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
